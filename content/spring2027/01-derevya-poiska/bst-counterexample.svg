<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="'PT Sans',sans-serif">
  <rect width="560" height="300" rx="14" fill="#10263A"/>
  <g transform="translate(60,16)">
    <g stroke="#31405F" stroke-width="2">
      <line x1="220" y1="52" x2="120" y2="122"/><line x1="220" y1="52" x2="320" y2="122"/>
      <line x1="320" y1="122" x2="250" y2="192"/><line x1="320" y1="122" x2="390" y2="192"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <circle cx="220" cy="46" r="22" fill="#0E1524" stroke="#4FC3F7" stroke-width="2"/><text x="220" y="52" fill="#E8EDF7">10</text>
      <circle cx="120" cy="122" r="22" fill="#141B2E" stroke="#31405F" stroke-width="2"/><text x="120" y="128" fill="#E8EDF7">5</text>
      <circle cx="320" cy="122" r="22" fill="#141B2E" stroke="#31405F" stroke-width="2"/><text x="320" y="128" fill="#E8EDF7">15</text>
      <circle cx="250" cy="192" r="22" fill="#2A1620" stroke="#FF6B6B" stroke-width="2.5"/><text x="250" y="198" fill="#FFB4AE">6</text>
      <circle cx="390" cy="192" r="22" fill="#141B2E" stroke="#31405F" stroke-width="2"/><text x="390" y="198" fill="#E8EDF7">20</text>
    </g>
    <g font-size="13.5" text-anchor="middle">
      <text x="230" y="240" fill="#FFB4AE">6 &lt; 15 — с родителем всё хорошо, но 6 &lt; 10:</text>
      <text x="230" y="258" fill="#FFB4AE">в правом поддереве корня узлу 6 не место</text>
    </g>
  </g>
</svg>
