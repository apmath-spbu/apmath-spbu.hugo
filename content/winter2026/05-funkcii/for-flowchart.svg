<svg xmlns="http://www.w3.org/2000/svg" width="522" height="312" viewBox="-26 -26 522 312" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="522" height="312" rx="16" fill="#0E1524"/>
        <defs>
          <marker id="a52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4FC3F7"/>
          </marker>
          <marker id="a52r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#FF5F57"/>
          </marker>
        </defs>
        <g font-size="13.5" text-anchor="middle">
          <!-- init сверху -->
          <rect x="150" y="20" width="100" height="38" rx="10" fill="#16203A" stroke="#26355C"/>
          <text x="200" y="44" fill="#E8EDF7" class="mono">init</text>
          <line x1="200" y1="58" x2="200" y2="120" stroke="#4FC3F7" stroke-width="1.6" marker-end="url(#a52)"/>
          <!-- cond -->
          <path d="M200,124 L265,150 L200,176 L135,150 Z" fill="#2A2312" stroke="#FEBC2E" stroke-width="1.5"/>
          <text x="200" y="155" fill="#FEBC2E" class="mono">cond?</text>
          <!-- true -> тело (вправо) -->
          <line x1="265" y1="150" x2="301" y2="150" stroke="#37D67A" stroke-width="1.6" marker-end="url(#a52)"/>
          <text x="283" y="138" fill="#37D67A" font-size="12">true</text>
          <rect x="305" y="129" width="90" height="42" rx="10" fill="#12251C" stroke="#37D67A" stroke-width="1.5"/>
          <text x="350" y="155" fill="#E8EDF7" class="mono">тело</text>
          <!-- тело -> step (вниз) -->
          <line x1="350" y1="171" x2="350" y2="200" stroke="#4FC3F7" stroke-width="1.6" marker-end="url(#a52)"/>
          <rect x="305" y="204" width="90" height="38" rx="10" fill="#16203A" stroke="#26355C"/>
          <text x="350" y="228" fill="#E8EDF7" class="mono">step</text>
          <!-- step -> cond (влево и вверх в нижнюю вершину) -->
          <path d="M305,223 L200,223 L200,180" fill="none" stroke="#4FC3F7" stroke-width="1.6" marker-end="url(#a52)"/>
          <!-- false -> выход (влево) -->
          <line x1="135" y1="150" x2="104" y2="150" stroke="#FF5F57" stroke-width="1.5" marker-end="url(#a52r)"/>
          <text x="118" y="138" fill="#FF8A80" font-size="12">false</text>
          <rect x="10" y="129" width="90" height="42" rx="10" fill="#2A1620" stroke="#FF5F57" stroke-width="1.5"/>
          <text x="55" y="155" fill="#FFB4AE" class="mono">выход</text>
        </g>
      </svg>