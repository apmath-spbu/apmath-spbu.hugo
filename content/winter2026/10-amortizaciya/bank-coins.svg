<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="412" viewBox="-26 -26 1172 412" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="1172" height="412" rx="16" fill="#0E1524"/>
    <g font-size="13.5" text-anchor="middle">
      <!-- состояние после переезда: cap=8, size=4, монеток нет -->
      <text x="90" y="48" fill="#8FA0C0" font-size="14" text-anchor="start">после переезда (cap = 8):</text>
      <g class="mono">
        <rect x="330" y="26" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="358" y="52" fill="#E8EDF7">a</text>
        <rect x="386" y="26" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="414" y="52" fill="#E8EDF7">b</text>
        <rect x="442" y="26" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="470" y="52" fill="#E8EDF7">c</text>
        <rect x="498" y="26" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="526" y="52" fill="#E8EDF7">d</text>
        <rect x="554" y="26" width="56" height="40" fill="#141B2E" stroke="#31405F" stroke-dasharray="5 4"/>
        <rect x="610" y="26" width="56" height="40" fill="#141B2E" stroke="#31405F" stroke-dasharray="5 4"/>
        <rect x="666" y="26" width="56" height="40" fill="#141B2E" stroke="#31405F" stroke-dasharray="5 4"/>
        <rect x="722" y="26" width="56" height="40" fill="#141B2E" stroke="#31405F" stroke-dasharray="5 4"/>
      </g>
      <text x="850" y="52" fill="#8FA0C0" font-size="13" text-anchor="start">монеток нет — всё потрачено</text>

      <!-- push e,f: монетки копятся -->
      <text x="90" y="138" fill="#8FA0C0" font-size="14" text-anchor="start">четыре push (по 3 монеты):</text>
      <g class="mono">
        <rect x="330" y="116" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="358" y="142" fill="#E8EDF7">a</text>
        <rect x="386" y="116" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="414" y="142" fill="#E8EDF7">b</text>
        <rect x="442" y="116" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="470" y="142" fill="#E8EDF7">c</text>
        <rect x="498" y="116" width="56" height="40" fill="#10263A" stroke="#4FC3F7"/><text x="526" y="142" fill="#E8EDF7">d</text>
        <rect x="554" y="116" width="56" height="40" fill="#12251C" stroke="#37D67A" stroke-width="1.6"/><text x="582" y="142" fill="#37D67A">e</text>
        <rect x="610" y="116" width="56" height="40" fill="#12251C" stroke="#37D67A" stroke-width="1.6"/><text x="638" y="142" fill="#37D67A">f</text>
        <rect x="666" y="116" width="56" height="40" fill="#12251C" stroke="#37D67A" stroke-width="1.6"/><text x="694" y="142" fill="#37D67A">g</text>
        <rect x="722" y="116" width="56" height="40" fill="#12251C" stroke="#37D67A" stroke-width="1.6"/><text x="750" y="142" fill="#37D67A">h</text>
      </g>
      <!-- монетки: на новых по одной своей, на старых по одной от новых -->
      <g fill="#FEBC2E">
        <circle cx="358" cy="106" r="7"/><circle cx="414" cy="106" r="7"/>
        <circle cx="470" cy="106" r="7"/><circle cx="526" cy="106" r="7"/>
        <circle cx="582" cy="106" r="7"/><circle cx="638" cy="106" r="7"/>
        <circle cx="694" cy="106" r="7"/><circle cx="750" cy="106" r="7"/>
      </g>
      <text x="850" y="142" fill="#8FA0C0" font-size="13" text-anchor="start">на каждом элементе — монетка</text>

      <!-- переезд оплачен -->
      <text x="90" y="240" fill="#8FA0C0" font-size="14" text-anchor="start">вектор полон → переезд:</text>
      <g class="mono">
        <rect x="330" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="382" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="434" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="486" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="538" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="590" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="642" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <rect x="694" y="218" width="52" height="40" fill="#10263A" stroke="#4FC3F7"/>
        <text x="538" y="290" fill="#FEBC2E" font-size="14" font-family="PT Sans">каждое копирование оплачено монеткой с элемента — банк в нуле, но не в минусе</text>
      </g>
      <text x="850" y="244" fill="#8FA0C0" font-size="13" text-anchor="start">→ новый буфер cap = 16</text>
    </g>
  </svg>