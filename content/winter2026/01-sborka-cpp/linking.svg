<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="352" viewBox="-26 -26 1182 352" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="1182" height="352" rx="16" fill="#0E1524"/>
    <defs>
      <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#4FC3F7"/>
      </marker>
    </defs>
    <g text-anchor="middle" font-size="14">
      <!-- static -->
      <text x="280" y="28" fill="#37D67A" font-weight="bold" font-size="16">Статическая (.a / .lib)</text>
      <rect x="60" y="50" width="130" height="46" rx="9" fill="#16203A" stroke="#26355C"/>
      <text x="125" y="78" fill="#E8EDF7" class="mono" font-size="13">main.o</text>
      <rect x="60" y="106" width="130" height="46" rx="9" fill="#16203A" stroke="#26355C"/>
      <text x="125" y="134" fill="#E8EDF7" class="mono" font-size="13">libmath.a</text>
      <line x1="190" y1="75" x2="250" y2="98" stroke="#4FC3F7" stroke-width="1.5" marker-end="url(#a4)"/>
      <line x1="190" y1="129" x2="250" y2="108" stroke="#4FC3F7" stroke-width="1.5" marker-end="url(#a4)"/>
      <rect x="250" y="72" width="220" height="62" rx="12" fill="#12251C" stroke="#37D67A" stroke-width="1.6"/>
      <text x="360" y="98" fill="#E8EDF7" font-weight="bold">программа</text>
      <text x="360" y="119" fill="#8FA0C0" font-size="12.5">код библиотеки скопирован внутрь</text>
      <g font-size="13" text-anchor="start">
        <text x="66" y="196" fill="#37D67A">+ один самодостаточный файл</text>
        <text x="66" y="218" fill="#37D67A">+ нет проблем с версиями</text>
        <text x="66" y="240" fill="#FF5F57">− больше размер</text>
        <text x="66" y="262" fill="#FF5F57">− обновление = пересборка</text>
      </g>
      <!-- dynamic -->
      <text x="840" y="28" fill="#4FC3F7" font-weight="bold" font-size="16">Динамическая (.so / .dylib / .dll)</text>
      <rect x="620" y="50" width="130" height="46" rx="9" fill="#16203A" stroke="#26355C"/>
      <text x="685" y="78" fill="#E8EDF7" class="mono" font-size="13">main.o</text>
      <line x1="750" y1="75" x2="810" y2="93" stroke="#4FC3F7" stroke-width="1.5" marker-end="url(#a4)"/>
      <rect x="810" y="66" width="220" height="62" rx="12" fill="#10263A" stroke="#4FC3F7" stroke-width="1.6"/>
      <text x="920" y="92" fill="#E8EDF7" font-weight="bold">программа</text>
      <text x="920" y="113" fill="#8FA0C0" font-size="12.5">внутри — только ссылка</text>
      <rect x="620" y="150" width="180" height="50" rx="9" fill="#16203A" stroke="#4FC3F7" stroke-dasharray="5 4"/>
      <text x="710" y="172" fill="#E8EDF7" class="mono" font-size="13">libc++.dylib</text>
      <text x="710" y="190" fill="#8FA0C0" font-size="12">грузится при запуске</text>
      <line x1="860" y1="128" x2="740" y2="150" stroke="#8FA0C0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a4)"/>
      <g font-size="13" text-anchor="start">
        <text x="620" y="230" fill="#37D67A">+ одна копия на все программы, обновляется отдельно</text>
        <text x="620" y="252" fill="#FF5F57">− «dll hell»: версия на машине ≠ версия при сборке</text>
        <text x="620" y="274" fill="#8FA0C0">стандартная библиотека обычно линкуется динамически</text>
      </g>
    </g>
  </svg>