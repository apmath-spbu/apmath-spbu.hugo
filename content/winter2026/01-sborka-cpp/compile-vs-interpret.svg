<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="322" viewBox="-26 -26 1182 322" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="1182" height="322" rx="16" fill="#0E1524"/>
