<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="412" viewBox="-26 -26 1172 412" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="1172" height="412" rx="16" fill="#0E1524"/>
    <g font-size="14" text-anchor="middle">
      <!-- schoolbook 4-way -->
      <text x="270" y="26" fill="#FF5F57" font-weight="bold" font-size="16">наивно: ×4 на уровень</text>
      <rect x="230" y="44" width="80" height="34" rx="9" fill="#2A1620" stroke="#FF5F57" stroke-width="1.5"/>
      <text x="270" y="66" fill="#E8EDF7" class="mono">n</text>
      <g stroke="#5C3040" stroke-width="1.3">
        <line x1="270" y1="78" x2="105" y2="120"/><line x1="270" y1="78" x2="215" y2="120"/>
        <line x1="270" y1="78" x2="325" y2="120"/><line x1="270" y1="78" x2="435" y2="120"/>
      </g>
      <g class="mono">
        <rect x="70"  y="120" width="70" height="30" rx="8" fill="#1E1520" stroke="#5C3040"/><text x="105" y="140" fill="#C9A0B0">n/2</text>
        <rect x="180" y="120" width="70" height="30" rx="8" fill="#1E1520" stroke="#5C3040"/><text x="215" y="140" fill="#C9A0B0">n/2</text>
        <rect x="290" y="120" width="70" height="30" rx="8" fill="#1E1520" stroke="#5C3040"/><text x="325" y="140" fill="#C9A0B0">n/2</text>
        <rect x="400" y="120" width="70" height="30" rx="8" fill="#1E1520" stroke="#5C3040"/><text x="435" y="140" fill="#C9A0B0">n/2</text>
      </g>
      <text x="270" y="185" fill="#8FA0C0" font-size="13">уровень k: 4ᵏ задач × (n/2ᵏ) работы = 2ᵏ·n → растёт!</text>
      <text x="270" y="215" fill="#FF8A80" font-size="15">низ доминирует: Θ(n²)</text>
      <!-- karatsuba 3-way -->
      <text x="840" y="26" fill="#37D67A" font-weight="bold" font-size="16">Карацуба: ×3 на уровень</text>
      <rect x="800" y="44" width="80" height="34" rx="9" fill="#12251C" stroke="#37D67A" stroke-width="1.5"/>
      <text x="840" y="66" fill="#E8EDF7" class="mono">n</text>
      <g stroke="#1F4D35" stroke-width="1.3">
        <line x1="840" y1="78" x2="700" y2="120"/><line x1="840" y1="78" x2="840" y2="120"/><line x1="840" y1="78" x2="980" y2="120"/>
      </g>
      <g class="mono">
        <rect x="665" y="120" width="70" height="30" rx="8" fill="#12251C" stroke="#1F4D35"/><text x="700" y="140" fill="#9FD9B4">n/2</text>
        <rect x="805" y="120" width="70" height="30" rx="8" fill="#12251C" stroke="#1F4D35"/><text x="840" y="140" fill="#9FD9B4">n/2</text>
        <rect x="945" y="120" width="70" height="30" rx="8" fill="#12251C" stroke="#1F4D35"/><text x="980" y="140" fill="#9FD9B4">n/2</text>
      </g>
      <g stroke="#1F4D35" stroke-width="1" opacity="0.7">
        <line x1="700" y1="150" x2="660" y2="185"/><line x1="700" y1="150" x2="700" y2="185"/><line x1="700" y1="150" x2="740" y2="185"/>
        <line x1="840" y1="150" x2="800" y2="185"/><line x1="840" y1="150" x2="840" y2="185"/><line x1="840" y1="150" x2="880" y2="185"/>
        <line x1="980" y1="150" x2="940" y2="185"/><line x1="980" y1="150" x2="980" y2="185"/><line x1="980" y1="150" x2="1020" y2="185"/>
      </g>
      <g fill="#7FB99A" font-size="12" class="mono">
        <text x="660" y="200">n/4</text><text x="700" y="200">n/4</text><text x="740" y="200">n/4</text>
        <text x="800" y="200">n/4</text><text x="840" y="200">n/4</text><text x="880" y="200">n/4</text>
        <text x="940" y="200">n/4</text><text x="980" y="200">n/4</text><text x="1020" y="200">n/4</text>
      </g>
      <text x="840" y="240" fill="#8FA0C0" font-size="13">уровень k: 3ᵏ задач × (n/2ᵏ) = (3/2)ᵏ·n — низ всё ещё главный,</text>
      <text x="840" y="262" fill="#8FA0C0" font-size="13">но листьев 3^(log₂ n) = n^(log₂ 3) — меньше, чем n²</text>
      <text x="840" y="296" fill="#37D67A" font-size="15">Θ(n<tspan baseline-shift="super" font-size="10">log₂ 3</tspan>) ≈ Θ(n<tspan baseline-shift="super" font-size="10">1.585</tspan>)</text>
    </g>
  </svg>