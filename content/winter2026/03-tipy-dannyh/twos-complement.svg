              <rect x="400" y="50" width="40" height="34" fill="#10263A" stroke="#4FC3F7"/><text x="420" y="72" fill="#E8EDF7">1</text>
            </g>
          </g>
          <!-- инверсия -->
          <text x="280" y="118" fill="#8FA0C0" font-family="PT Sans">инвертировать все биты (~x) и прибавить 1:</text>
          <!-- -5 -->
          <g>
            <text x="60" y="168" fill="#E8EDF7" font-family="PT Sans" text-anchor="start">−5</text>
            <g>
              <rect x="120" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="140" y="168" fill="#FFB4AE">1</text>
              <rect x="160" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="180" y="168" fill="#FFB4AE">1</text>
              <rect x="200" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="220" y="168" fill="#FFB4AE">1</text>
              <rect x="240" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="260" y="168" fill="#FFB4AE">1</text>
              <rect x="280" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="300" y="168" fill="#FFB4AE">1</text>
              <rect x="320" y="146" width="40" height="34" fill="#141B2E" stroke="#31405F"/><text x="340" y="168" fill="#8FA0C0">0</text>
              <rect x="360" y="146" width="40" height="34" fill="#2A1620" stroke="#FF5F57"/><text x="380" y="168" fill="#FFB4AE">1</text>
