<svg xmlns="http://www.w3.org/2000/svg" width="612" height="322" viewBox="-26 -26 612 322" style="max-width:100%;height:auto"><style>text{font-family:'PT Sans','Segoe UI',Verdana,sans-serif}.mono{font-family:Menlo,Consolas,'Courier New',monospace}</style><rect x="-26" y="-26" width="612" height="322" rx="16" fill="#0E1524"/>
        <g font-size="14" text-anchor="middle" class="mono">
          <text x="280" y="24" fill="#8FA0C0" font-size="15" font-family="PT Sans">int8_t (8 бит): значение = −128·b₇ + 64·b₆ + … + 1·b₀</text>
          <!-- 5 -->
