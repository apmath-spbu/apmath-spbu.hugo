              <rect x="120" y="50" width="40" height="34" fill="#141B2E" stroke="#31405F"/><text x="140" y="72" fill="#8FA0C0">0</text>
              <rect x="160" y="50" width="40" height="34" fill="#141B2E" stroke="#31405F"/><text x="180" y="72" fill="#8FA0C0">0</text>
              <rect x="200" y="50" width="40" height="34" fill="#141B2E" stroke="#31405F"/><text x="220" y="72" fill="#8FA0C0">0</text>
              <rect x="240" y="50" width="40" height="34" fill="#141B2E" stroke="#31405F"/><text x="260" y="72" fill="#8FA0C0">0</text>
